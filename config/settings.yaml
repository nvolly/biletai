# BiletAI server settings. Secrets are NOT here: they come from the server environment
# (.env on the server or the hosting provider's secret settings) — see .env.example.

builder: # one Bet Builder-style combination on ONE match
  minLegs: 2
  maxLegs: 4
  minOdds: 1.25 # fair odds of the whole combination = 1 / P(all selections win)
  maxOdds: 2.0
  legMinOdds: 1.05 # skip selections more than ~95% likely
  maxCandidateLegs: 40
  beamWidth: 8

tickets:
  windowHours: 72
  defaultTickets: 1
  defaultMatches: 5
  maxTickets: 5
  maxMatches: 15

model:
  seasons: 3
  decayPerDay: 0.0019 # ~1-year half-life
  shrinkage: 4
  simulations: 20000
  maxStaleDays: 14
  modelWeight: 0.25 # model vs the market average prices for expected goals (backtest)

jev:
  model: jev-latest
  dropIfKeyPlayerMissing: 0.97
  keyPlayerDownweight: 0.05
  dropIfRotation: 0.7
  dropIfLowInfo: 0.6
  dropIfHighRisk: 0.5
  riskDownweight: 0.15
  minSlipConsistency: 0.5

news:
  maxSearches: 2
  cacheHours: 36

ai:
  enabled: true # false = statistical models only (no AI cost)
  parallel: 6

server:
  port: 8787
  freeGenerations: 2 # then the plans popup
  freeQuestions: 3 # "ask about the ticket" questions per free generation

# Plans (owner, 2026-10-09). Prices include VAT. No payments until the ONJN answer and the
# lawyer's review: until then plans are assigned with `npm run user -- plan <email> <id>`.
# Sized so even a user who spends the whole plan with no news-cache hits stays profitable
# at a pessimistic 0.50 lei per generation (see the cost meter: npm run user -- costs).
plans:
  - { id: start, name: Start, period: month, priceRon: 29, generations: 15, questions: 3 }
  - { id: pro, name: Pro, period: month, priceRon: 59, generations: 40, questions: 5, featured: true }
  - { id: max, name: Max, period: month, priceRon: 99, generations: 80, questions: 10 }
  - { id: topup10, name: '+10 generări', period: once, priceRon: 25, generations: 10, questions: 3 }

# Cost meter prices in USD (DeepSeek peak rates and Jev list price, checked 2026-10-09).
costs:
  deepseekInputPerM: 0.3
  deepseekCachedInputPerM: 0.006
  deepseekOutputPerM: 1.2
  webSearchEach: 0
  jevInputPerM: 0.042
  usdToRon: 4.5
