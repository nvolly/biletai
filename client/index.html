<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiletAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ctext x='32' y='45' font-family='Segoe UI,Arial' font-size='36' font-weight='800' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
  /* Black and white only. Light = white page, black ink; dark = black page, white ink. */
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #000000; --muted: #6b6b6b; --line: #e2e2e2; --field: #f4f4f4;
    --solid: #000000; --solid-ink: #ffffff; --soft: #f0f0f0;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --panel: #0d0d0d; --ink: #ffffff; --muted: #9a9a9a; --line: #262626; --field: #161616;
    --solid: #ffffff; --solid-ink: #000000; --soft: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --panel: #0d0d0d; --ink: #ffffff; --muted: #9a9a9a; --line: #262626; --field: #161616;
      --solid: #ffffff; --solid-ink: #000000; --soft: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--solid); color: var(--solid-ink); display: grid; place-items: center; font-weight: 800; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .3px; font-weight: 800; } h1 span { font-weight: 400; }
  .spacer { flex: 1; }
  .pill { padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { border-color: var(--ink); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 700; padding: 4px 10px; cursor: pointer; }
  .seg button.on { background: var(--solid); color: var(--solid-ink); }
  .icon { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; }
  main { display: grid; grid-template-columns: minmax(330px, 410px) 1fr; gap: 18px; padding: 18px 22px 28px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; padding: 14px 16px; } header { padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: block; font-size: 12px; color: var(--muted); }
  input, select { font: inherit; color: var(--ink); }
  label.f input, label.f select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--field); }
  input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 210px; overflow: auto; padding: 2px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; background: var(--field); font-size: 12.5px; user-select: none; }
  .chip.on { background: var(--solid); color: var(--solid-ink); border-color: var(--solid); }
  .hint { font-size: 12px; color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 16px; border-radius: 10px; font: inherit; font-weight: 650; cursor: pointer; }
  .btn.primary { background: var(--solid); color: var(--solid-ink); border-color: var(--solid); width: 100%; font-size: 15px; padding: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: 12.5px; }
  #msg { font-size: 13px; margin-top: 8px; min-height: 18px; } #msg.err { font-weight: 700; } #msg.err::before { content: "⚠ "; }
  .progress { height: 4px; border-radius: 999px; background: var(--soft); overflow: hidden; margin: 6px 0 10px; }
  .progress > div { height: 100%; width: 30%; background: var(--ink); animation: slide 1.4s infinite ease-in-out; border-radius: 999px; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  #log { font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); max-height: 150px; overflow: auto; white-space: pre-wrap; }
  .ticket { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; background: var(--panel); }
  .thead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; background: var(--solid); color: var(--solid-ink); }
  .thead b { font-size: 15px; } .stat { font-size: 12.5px; opacity: .75; } .stat strong { font-size: 14px; opacity: 1; }
  .thead .btn { background: transparent; color: var(--solid-ink); border-color: currentColor; }
  .match { padding: 11px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; }
  .match:last-child { border-bottom: 0; }
  .teams { font-weight: 700; } .meta { font-size: 12px; color: var(--muted); }
  .legs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .leg { font-size: 12.5px; padding: 3px 9px; border-radius: 8px; background: var(--field); border: 1px solid var(--line); }
  .leg em { font-style: normal; color: var(--muted); }
  .odds { text-align: right; } .odds .o { font-size: 17px; font-weight: 800; } .odds .p { font-size: 12px; color: var(--muted); }
  .why { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: 2px; border-left: 2px solid var(--line); padding-left: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .hist { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; gap: 8px; }
  .hist:last-child { border-bottom: 0; } .hist:hover { text-decoration: underline; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 20px 24px; max-width: 900px; margin: 0 auto; }
  .connect { max-width: 440px; margin: 70px auto; }
  .plans { display: grid; gap: 8px; margin-top: 10px; }
  .plan { display: flex; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">B</div>
  <h1>Bilet<span>AI</span></h1>
  <span class="hint" data-t="tagline"></span>
  <div class="spacer"></div>
  <span id="credits" class="pill"></span>
  <div class="seg" id="langSeg"><button data-lang="ro">RO</button><button data-lang="en">EN</button></div>
  <button class="icon" id="bTheme" title="">◐</button>
  <button class="btn small" id="bLogout" style="display:none" data-t="logout"></button>
</header>

<div id="connect" class="card connect" style="display:none">
  <h2 data-t="signIn"></h2>
  <label class="f"><span data-t="accessKey"></span> <input id="key" type="password" placeholder="bai_..." autocomplete="off"></label>
  <details style="margin-top:8px"><summary class="hint" data-t="server"></summary>
    <label class="f" style="margin-top:6px"><span data-t="serverAddr"></span> <input id="server" placeholder="https://..."></label>
  </details>
  <button class="btn primary" id="bConnect" style="margin-top:12px" data-t="enter"></button>
  <div id="cmsg" class="hint" style="margin-top:8px"></div>
</div>

<main id="app" style="display:none">
  <section>
    <div class="card">
      <h2 data-t="yourTickets"></h2>
      <div class="grid2">
        <label class="f"><span data-t="nTickets"></span> <input id="tickets" type="number" min="1" max="5" value="1"></label>
        <label class="f"><span data-t="nMatches"></span> <input id="matches" type="number" min="1" max="15" value="5"></label>
        <label class="f"><span data-t="oddsFrom"></span> <input id="minOdds" type="number" min="1.05" max="10" step="0.05" value="1.25"></label>
        <label class="f"><span data-t="oddsTo"></span> <input id="maxOdds" type="number" min="1.1" max="20" step="0.05" value="2.00"></label>
        <label class="f"><span data-t="maxLegs"></span> <select id="maxLegs"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label>
        <label class="f"><span data-t="within"></span> <select id="windowHours"><option value="24"></option><option value="48"></option><option value="72" selected></option><option value="144"></option></select></label>
      </div>
    </div>
    <div class="card">
      <h2><span data-t="leagues"></span> <span class="hint" style="text-transform:none;letter-spacing:0" data-t="noneAll"></span></h2>
      <div id="leagues" class="chips"></div>
      <div class="hint" style="margin-top:8px" data-t="leagueKey"></div>
    </div>
    <div class="card">
      <button class="btn primary" id="bGen" data-t="generate"></button>
      <div id="msg"></div>
      <div id="plansBox" style="display:none">
        <div class="hint" style="margin-top:6px" data-t="plans"></div>
        <div class="plans" id="plans"></div>
      </div>
    </div>
    <div class="card">
      <h2 data-t="history"></h2>
      <div id="history"></div>
    </div>
  </section>

  <section>
    <div class="card" id="runCard" style="display:none">
      <h2 data-t="working"></h2>
      <div class="progress"><div></div></div>
      <div id="log"></div>
    </div>
    <div id="results"><div class="card empty" data-t="emptyHtml"></div></div>
  </section>
</main>

<footer data-t="footerHtml"></footer>

<script>
const T = {
  ro: {
    tagline: 'Bilete de fotbal generate de AI · statistici + analiza știrilor', logout: 'Ieșire', signIn: 'Autentificare',
    accessKey: 'Cheie de acces', server: 'Server', serverAddr: 'Adresa serverului', enter: 'Intră în cont',
    yourTickets: 'Biletele tale', nTickets: 'Număr de bilete', nMatches: 'Meciuri pe bilet', oddsFrom: 'Cotă pe meci, de la',
    oddsTo: 'până la', maxLegs: 'Selecții pe meci (maxim)', within: 'Meciuri în următoarele',
    win: { 24: '24 de ore', 48: '2 zile', 72: '3 zile', 144: '6 zile' },
    leagues: 'Campionate', noneAll: '(niciunul selectat = toate)', leagueKey: '● = goluri, cornere, cartonașe și șuturi · restul: doar piețe de goluri',
    generate: 'Generează bilete', plans: 'Abonamente', history: 'Istoric', noHistory: 'Încă nu ai bilete generate.', working: 'Se generează',
    emptyHtml: 'Alege setările și apasă <b>Generează bilete</b>.<br>Pentru fiecare meci primești o combinație de 2–4 selecții, cu <b>probabilitatea</b> și <b>cota corectă</b>.',
    footerHtml: '<b>Doar pentru persoane peste 18 ani.</b> BiletAI oferă predicții statistice, nu garanții: orice meci se poate termina altfel. Cota corectă = 1 / probabilitatea calculată de model; compar-o cu ce ți se oferă. Joacă responsabil și doar cât îți permiți să pierzi.',
    left: (n, free) => (n === 1 ? '1 generare rămasă' : `${n} generări rămase`) + (free ? ` · ${free} gratuite` : ''),
    payLater: 'Plata online vine în curând.', badKey: 'Cheia de acces nu a fost acceptată.', noServer: (m) => `Serverul nu răspunde (${m}).`,
    ticket: 'Biletul', matches: 'meciuri', chance: 'șansă', fair: 'cotă corectă', copy: 'Copiază', copied: 'Bilet copiat.',
    none: 'Niciun meci nu se potrivește acum cu aceste setări. Încearcă un interval de cote mai larg sau mai multe zile.',
    short: (f, n) => `Am găsit ${f} din ${n} meciuri care au trecut toate verificările — biletele sunt mai scurte.`,
    oddsOrder: 'Cota „până la” trebuie să fie mai mare decât cota „de la”.', queued: 'În așteptare…', preparing: 'Se pregătesc modelele…', done: 'Gata.',
    histRow: (t, m) => `${t} bilet(e) · ${m} meciuri`, theme: 'Temă luminoasă / întunecată', locale: 'ro-RO',
    countries: { England: 'Anglia', Scotland: 'Scoția', Germany: 'Germania', Italy: 'Italia', Spain: 'Spania', France: 'Franța', Netherlands: 'Olanda', Belgium: 'Belgia', Portugal: 'Portugalia', Turkey: 'Turcia', Greece: 'Grecia', Argentina: 'Argentina', Austria: 'Austria', Brazil: 'Brazilia', China: 'China', Denmark: 'Danemarca', Finland: 'Finlanda', Ireland: 'Irlanda', Japan: 'Japonia', Mexico: 'Mexic', Norway: 'Norvegia', Poland: 'Polonia', Romania: 'România', Sweden: 'Suedia', Switzerland: 'Elveția', USA: 'SUA' },
  },
  en: {
    tagline: 'AI football tickets · statistics + news analysis', logout: 'Sign out', signIn: 'Sign in',
    accessKey: 'Access key', server: 'Server', serverAddr: 'Server address', enter: 'Sign in',
    yourTickets: 'Your tickets', nTickets: 'Tickets', nMatches: 'Matches per ticket', oddsFrom: 'Odds per match, from',
    oddsTo: 'to', maxLegs: 'Selections per match (max)', within: 'Matches within',
    win: { 24: '24 hours', 48: '2 days', 72: '3 days', 144: '6 days' },
    leagues: 'Leagues', noneAll: '(none selected = all)', leagueKey: '● = goals, corners, cards and shots · others: goal markets only',
    generate: 'Generate tickets', plans: 'Plans', history: 'History', noHistory: 'No tickets yet.', working: 'Generating',
    emptyHtml: 'Choose your settings and press <b>Generate tickets</b>.<br>Each match gets a combination of 2–4 selections with its <b>probability</b> and <b>fair odds</b>.',
    footerHtml: '<b>18+ only.</b> BiletAI provides statistical predictions, not guarantees: any match can go either way. Fair odds = 1 / the model\'s probability; compare them with what you are offered. Play responsibly and only what you can afford to lose.',
    left: (n, free) => (n === 1 ? '1 generation left' : `${n} generations left`) + (free ? ` · ${free} free` : ''),
    payLater: 'Online payment is coming soon.', badKey: 'That access key was not accepted.', noServer: (m) => `Can't reach the server (${m}).`,
    ticket: 'Ticket', matches: 'matches', chance: 'chance', fair: 'fair odds', copy: 'Copy', copied: 'Ticket copied.',
    none: 'No match fits these settings right now. Try a wider odds range or more days.',
    short: (f, n) => `Found ${f} of ${n} matches that passed every check — the tickets are shorter.`,
    oddsOrder: '"To" odds must be above "from" odds.', queued: 'Queued…', preparing: 'Preparing the models…', done: 'Done.',
    histRow: (t, m) => `${t} ticket(s) · ${m} matches`, theme: 'Light / dark theme', locale: 'en-GB', countries: {},
  },
};

const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
let LANG = store.get('biletai.lang') === 'en' ? 'en' : 'ro';
let SERVER = store.get('biletai.server') || (location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8787');
let KEY = store.get('biletai.key') || '';
let LEAGUES = [], LAST = null, ME = null;
const t = () => T[LANG];

// ---- theme: system by default, the button toggles light / dark ----
function applyTheme(v) { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; }
applyTheme(store.get('biletai.theme'));
$('bTheme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  store.set('biletai.theme', next); applyTheme(next);
};

// ---- language: every label, plus what the server and the AI write ----
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach((el) => {
    const v = t()[el.dataset.t];
    if (el.dataset.t.endsWith('Html')) el.innerHTML = v; else el.textContent = v;
  });
  [...$('windowHours').options].forEach((o) => { o.textContent = t().win[o.value]; });
  document.querySelectorAll('#langSeg button').forEach((b) => b.classList.toggle('on', b.dataset.lang === LANG));
  $('bTheme').title = t().theme;
  if (ME) showMe(ME);
  if (LEAGUES.length) drawLeagues();
  if (LAST) render(LAST); else if (!$('results').querySelector('.ticket')) $('results').innerHTML = `<div class="card empty">${t().emptyHtml}</div>`;
  history();
}
document.querySelectorAll('#langSeg button').forEach((b) => b.onclick = () => { LANG = b.dataset.lang; store.set('biletai.lang', LANG); applyLang(); });

async function api(path, opts = {}) {
  const r = await fetch(SERVER + path, { ...opts, headers: { 'content-type': 'application/json', authorization: `Bearer ${KEY}`, 'x-lang': LANG, ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { status: r.status, data: j });
  return j;
}

function say(s, k) { $('msg').textContent = s; $('msg').className = k || ''; }
const pct = (x) => `${(x * 100).toFixed(x < 0.1 ? 1 : 0)}%`;
const when = (iso) => new Date(iso).toLocaleString(t().locale, { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const country = (c) => t().countries[c] || c;

function showMe(me) {
  ME = me;
  const left = me.freeLeft + me.credits;
  $('credits').textContent = t().left(left, me.freeLeft);
  $('credits').className = 'pill' + (left ? ' ok' : '');
  $('bGen').disabled = !left;
  $('plansBox').style.display = left ? 'none' : '';
  if (me.plans) $('plans').innerHTML = me.plans.map((p) => `<div class="plan"><span>${LANG === 'ro' ? `${p.generations} generări` : `${p.generations} generations`}</span><b>${p.priceRon} lei</b></div>`).join('') +
    `<div class="hint">${t().payLater}</div>`;
}

function drawLeagues() {
  const on = new Set([...document.querySelectorAll('#leagues .chip.on')].map((c) => c.dataset.code));
  $('leagues').innerHTML = LEAGUES.map((l) => `<span class="chip${on.has(l.code) ? ' on' : ''}" data-code="${l.code}">${l.stats ? '● ' : ''}${esc(country(l.country))} · ${esc(l.name)}</span>`).join('');
  document.querySelectorAll('#leagues .chip').forEach((c) => c.onclick = () => c.classList.toggle('on'));
}

async function start() {
  applyLang();
  if (!KEY) { $('connect').style.display = ''; $('server').value = SERVER; return; }
  try {
    const me = await api('/v1/me');
    $('connect').style.display = 'none'; $('app').style.display = ''; $('bLogout').style.display = '';
    showMe(me);
    if (me.limits) { $('tickets').max = me.limits.maxTickets; $('matches').max = me.limits.maxMatches; }
    LEAGUES = await api('/v1/leagues');
    drawLeagues();
    history();
  } catch (e) {
    if (e.status === 401) { store.del('biletai.key'); KEY = ''; $('cmsg').textContent = t().badKey; }
    else $('cmsg').textContent = t().noServer(e.message);
    $('connect').style.display = ''; $('app').style.display = 'none'; $('server').value = SERVER;
  }
}

$('bConnect').onclick = () => {
  KEY = $('key').value.trim(); store.set('biletai.key', KEY);
  if ($('server').value.trim()) { SERVER = $('server').value.trim().replace(/\/$/, ''); store.set('biletai.server', SERVER); }
  start();
};
$('bLogout').onclick = () => { store.del('biletai.key'); KEY = ''; location.reload(); };

function ticketText(tk) {
  return `BiletAI — ${t().ticket} ${tk.index} (${t().fair} ${tk.fairOdds.toFixed(2)})\n` + tk.matches.map((m) =>
    `${m.fixture.home} – ${m.fixture.away} (${when(m.fixture.kickoff)}): ` + m.legs.map((l) => `${l.market}: ${l.pick}`).join(' + ')).join('\n');
}

/** Tickets are shown in the language they were generated in (the AI wrote them that way). */
function render(result) {
  LAST = result;
  if (!result.tickets.length) { $('results').innerHTML = `<div class="card empty">${t().none}</div>`; return; }
  const note = result.found < result.needed ? `<div class="card hint">${t().short(result.found, result.needed)}</div>` : '';
  $('results').innerHTML = note + result.tickets.map((tk) => `
    <div class="ticket">
      <div class="thead"><b>${t().ticket} ${tk.index}</b><span class="stat">${tk.matches.length} ${t().matches}</span><div class="spacer"></div>
        <span class="stat">${t().chance} <strong>${pct(tk.probability)}</strong></span><span class="stat">${t().fair} <strong>${tk.fairOdds.toFixed(2)}</strong></span>
        <button class="btn small" data-copy="${tk.index}">${t().copy}</button></div>
      ${tk.matches.map((m) => `
        <div class="match">
          <div><div class="teams">${esc(m.fixture.home)} – ${esc(m.fixture.away)}</div>
            <div class="meta">${esc(country(m.fixture.country))} · ${esc(m.fixture.leagueName)} · ${when(m.fixture.kickoff)}</div></div>
          <div class="odds"><div class="o">${m.fairOdds.toFixed(2)}</div><div class="p">${pct(m.adjusted)}</div></div>
          <div class="legs">${m.legs.map((l) => `<span class="leg">${esc(l.market)}: <b>${esc(l.pick)}</b> <em>${pct(l.probability)}</em></span>`).join('')}</div>
          ${m.explanation ? `<div class="why">${esc(m.explanation)}</div>` : ''}
        </div>`).join('')}
    </div>`).join('');
  document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => {
    navigator.clipboard.writeText(ticketText(result.tickets[Number(b.dataset.copy) - 1])).then(() => say(t().copied, 'ok'));
  });
}

async function history() {
  if (!KEY || $('app').style.display === 'none') { $('history').innerHTML = `<div class="hint">${t().noHistory}</div>`; return; }
  try {
    const items = await api('/v1/history');
    window._hist = items;
    $('history').innerHTML = items.length ? items.map((h, i) => `<div class="hist" data-i="${i}"><span>${when(h.createdAt)}</span><span class="hint">${t().histRow(h.tickets.length, h.found)}</span></div>`).join('')
      : `<div class="hint">${t().noHistory}</div>`;
    document.querySelectorAll('.hist').forEach((d) => d.onclick = () => render(window._hist[Number(d.dataset.i)]));
  } catch {}
}

$('bGen').onclick = async () => {
  const leagues = [...document.querySelectorAll('#leagues .chip.on')].map((c) => c.dataset.code);
  const req = {
    tickets: +$('tickets').value, matches: +$('matches').value, minOdds: +$('minOdds').value, maxOdds: +$('maxOdds').value,
    maxLegs: +$('maxLegs').value, windowHours: +$('windowHours').value, leagues, lang: LANG,
  };
  if (!(req.maxOdds > req.minOdds)) return say(t().oddsOrder, 'err');
  $('bGen').disabled = true; say('');
  try {
    const { jobId } = await api('/v1/generate', { method: 'POST', body: JSON.stringify(req) });
    $('runCard').style.display = ''; $('log').textContent = t().queued;
    for (;;) {
      await new Promise((r) => setTimeout(r, 2000));
      const j = await api(`/v1/jobs/${jobId}`);
      $('log').textContent = j.log.slice(-12).join('\n') || t().preparing;
      $('log').scrollTop = $('log').scrollHeight;
      if (j.status === 'done') { render(j.result); showMe(j.me); history(); say(t().done, 'ok'); break; }
      if (j.status === 'failed') { say(j.error, 'err'); break; }
    }
  } catch (e) {
    say(e.message, 'err');
    if (e.status === 402 && e.data?.plans) showMe({ freeLeft: 0, credits: 0, plans: e.data.plans });
  } finally {
    $('runCard').style.display = 'none';
    $('bGen').disabled = false;
    api('/v1/me').then(showMe).catch(() => {});
  }
};

start();
</script>
</body>
</html>
